name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    name: Build macOS app
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install icon tooling dependency
        run: python -m pip install Pillow

      - name: Build app bundle
        run: ./script/build_and_run.sh --package

      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent dist/CodexAccount.app CodexAccount.app.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexAccount.app
          path: CodexAccount.app.zip

      - name: Attach app to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.tag_name || github.ref_name }}
          files: CodexAccount.app.zip
